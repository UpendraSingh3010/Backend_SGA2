<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleet Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --border: #dfe3ea;
      --accent: #2463eb; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --idle: #6b7280; --emerg: #9d174d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); }
    .layout { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
    aside { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
    #map { height: 100vh; }
    h1 { font-size: 18px; margin: 0 0 2px; }
    .sub { color: var(--muted); margin: 0 0 14px; font-size: 12px; }
    section { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
    input, select { width: 100%; padding: 7px 8px; border: 1px solid var(--border); border-radius: 6px; font: inherit; }
    button { margin-top: 8px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: #e8edf7; color: var(--accent); }
    .row { display: flex; gap: 8px; } .row > * { flex: 1; }
    .status { font-size: 12px; margin-top: 6px; color: var(--muted); min-height: 1em; word-break: break-word; }
    .status.err { color: var(--bad); }
    ul.list { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
    ul.list li { padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; }
    ul.list li:last-child { border-bottom: 0; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; color: #fff; }
    .b-active { background: var(--ok); } .b-idle { background: var(--idle); } .b-maintenance { background: var(--warn); }
    .b-out_of_service { background: var(--bad); } .b-emergency { background: var(--emerg); }
    .b-sent { background: var(--ok); } .b-failed { background: var(--bad); } .b-pending { background: var(--idle); }
    .muted { color: var(--muted); font-size: 12px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); }
      #map { height: 70vh; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>Fleet Map</h1>
    <p class="sub">Every call goes through the API Gateway (<code>x-api-key</code> + JWT)</p>

    <section>
      <h2>1. Connect</h2>
      <label for="apiKey">API key</label>
      <input id="apiKey" value="dev-api-key-123" />
      <div class="row">
        <div><label for="email">Email</label><input id="email" value="admin@fleet.local" /></div>
        <div><label for="password">Password</label><input id="password" type="password" value="Admin@123" /></div>
      </div>
      <button id="loginBtn">Log in &amp; load fleet</button>
      <div id="loginStatus" class="status"></div>
      <div class="legend">
        <span class="badge b-active">active</span><span class="badge b-idle">idle</span>
        <span class="badge b-maintenance">maintenance</span><span class="badge b-out_of_service">out of service</span>
        <span class="badge b-emergency">emergency</span>
      </div>
    </section>

    <section>
      <h2>2. Nearby vehicles</h2>
      <label for="address">Address (geocoded with OpenStreetMap) - or click the map</label>
      <input id="address" placeholder="e.g. India Gate, New Delhi" />
      <div class="row">
        <div><label for="radius">Radius (km)</label><input id="radius" type="number" value="5" min="0.1" max="500" step="0.5" /></div>
        <div><label for="statusFilter">Status</label>
          <select id="statusFilter"><option value="">any</option><option>active</option><option>idle</option><option>maintenance</option><option>out_of_service</option><option>emergency</option></select>
        </div>
      </div>
      <button id="searchBtn">Search nearby</button>
      <div id="searchStatus" class="status"></div>
      <ul id="nearbyList" class="list"></ul>
    </section>

    <section>
      <h2>3. Recent SMS notifications</h2>
      <button id="notifBtn" class="secondary">Refresh notifications</button>
      <div id="notifStatus" class="status"></div>
      <ul id="notifList" class="list"></ul>
    </section>
  </aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const COLORS = { active: '#15803d', idle: '#6b7280', maintenance: '#b45309', out_of_service: '#b91c1c', emergency: '#9d174d' };
  let token = null;

  const map = L.map('map').setView([28.6139, 77.209], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
  const fleetLayer = L.layerGroup().addTo(map);
  const searchLayer = L.layerGroup().addTo(map);
  const markersById = {};

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function setStatus(el, msg, isError) { el.textContent = msg; el.className = 'status' + (isError ? ' err' : ''); }

  async function api(path, opts = {}) {
    const headers = { 'x-api-key': $('apiKey').value.trim(), 'content-type': 'application/json' };
    if (token) headers.authorization = 'Bearer ' + token;
    const res = await fetch(path, { ...opts, headers });
    const body = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) throw new Error((body && body.error && `${body.error.status} ${body.error.code}: ${body.error.message}`) || `HTTP ${res.status}`);
    return { body, servedBy: res.headers.get('x-served-by') };
  }

  function popupHtml(p, extra = '') {
    return `<b>${esc(p.registrationNumber)}</b><br>${esc(p.make)} ${esc(p.model)} (${esc(p.type)})<br>` +
      `<span class="badge b-${esc(p.status)}">${esc(p.status)}</span>${extra}`;
  }

  async function loadFleet() {
    const { body } = await api('/api/maps/vehicles');
    fleetLayer.clearLayers();
    body.features.forEach((f) => {
      const [lng, lat] = f.geometry.coordinates;
      const m = L.circleMarker([lat, lng], { radius: 8, color: '#fff', weight: 2, fillColor: COLORS[f.properties.status] || '#333', fillOpacity: 0.95 })
        .bindPopup(popupHtml(f.properties)).addTo(fleetLayer);
      markersById[f.properties.id] = m;
    });
    if (body.features.length) map.fitBounds(fleetLayer.getLayers().map((l) => l.getLatLng()), { padding: [40, 40] });
    return body.features.length;
  }

  async function login() {
    setStatus($('loginStatus'), 'Logging in...');
    try {
      token = null;
      const { body } = await api('/api/users/login', { method: 'POST', body: JSON.stringify({ email: $('email').value, password: $('password').value }) });
      token = body.token;
      const n = await loadFleet();
      setStatus($('loginStatus'), `Logged in as ${body.user.name} (${body.user.role}). ${n} vehicles on the map.`);
      loadNotifications();
    } catch (e) { setStatus($('loginStatus'), e.message, true); }
  }

  async function searchNearby(center) {
    if (!token) return setStatus($('searchStatus'), 'Log in first', true);
    const params = new URLSearchParams({ radiusKm: $('radius').value || '5' });
    if (center) { params.set('lat', center.lat); params.set('lng', center.lng); }
    else if ($('address').value.trim()) params.set('address', $('address').value.trim());
    else return setStatus($('searchStatus'), 'Enter an address or click on the map', true);
    if ($('statusFilter').value) params.set('status', $('statusFilter').value);

    setStatus($('searchStatus'), 'Searching...');
    try {
      const { body, servedBy } = await api('/api/maps/nearby?' + params);
      searchLayer.clearLayers();
      const c = [body.center.lat, body.center.lng];
      L.circle(c, { radius: body.radiusKm * 1000, color: '#2463eb', weight: 1.5, fillOpacity: 0.08 }).addTo(searchLayer);
      L.marker(c).bindPopup(`<b>Search centre</b><br>${esc(body.center.address || c.map((x) => x.toFixed(5)).join(', '))}`).addTo(searchLayer).openPopup();
      map.fitBounds(L.latLng(c).toBounds(body.radiusKm * 2000), { padding: [20, 20] });

      $('nearbyList').innerHTML = body.vehicles.map((v) =>
        `<li data-id="${esc(v.id)}"><b>${esc(v.registrationNumber)}</b> <span class="badge b-${esc(v.status)}">${esc(v.status)}</span>` +
        `<br><span class="muted">${esc(v.make)} ${esc(v.model)} - ${v.distanceKm.toFixed(2)} km away</span></li>`).join('') ||
        '<li class="muted">No vehicles in this radius</li>';
      setStatus($('searchStatus'), `${body.count} vehicle(s) within ${body.radiusKm} km (centre: ${body.center.source}, served by ${servedBy})`);
    } catch (e) { setStatus($('searchStatus'), e.message, true); }
  }

  async function loadNotifications() {
    if (!token) return setStatus($('notifStatus'), 'Log in first', true);
    try {
      const { body } = await api('/api/notifications?limit=15');
      $('notifList').innerHTML = body.data.map((n) =>
        `<li title="${esc(n.message)}"><span class="badge b-${esc(n.status)}">${esc(n.status)}</span> <b>${esc(n.type.replace('_', ' '))}</b> ` +
        `${esc(n.registrationNumber || '')}<br><span class="muted">to ${esc(n.recipient.name || '')} ${esc(n.recipient.phone)} - ${new Date(n.createdAt).toLocaleTimeString()}` +
        `${n.error ? '<br>' + esc(n.error) : ''}</span></li>`).join('') || '<li class="muted">No notifications yet</li>';
      setStatus($('notifStatus'), `${body.total} notification(s) in total`);
    } catch (e) { setStatus($('notifStatus'), e.message, true); }
  }

  $('loginBtn').onclick = login;
  $('searchBtn').onclick = () => searchNearby();
  $('notifBtn').onclick = loadNotifications;
  $('address').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchNearby(); });
  map.on('click', (e) => { $('address').value = ''; searchNearby({ lat: e.latlng.lat.toFixed(6), lng: e.latlng.lng.toFixed(6) }); });
  $('nearbyList').addEventListener('click', (e) => {
    const li = e.target.closest('li[data-id]');
    const m = li && markersById[li.dataset.id];
    if (m) { map.setView(m.getLatLng(), 15); m.openPopup(); }
  });
</script>
</body>
</html>
